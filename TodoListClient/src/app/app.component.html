<header class="topbar" *ngIf="authService.isAuthenticated()">
  <div class="topbar-inner">
    <a routerLink="/" class="brand"><span class="icon">✨</span> To-Do List</a>
    <div class="topbar-user" *ngIf="authService.currentUser() as user">
      <a routerLink="/profile" class="user-chip">
        <img
          *ngIf="pictureUrl(user.profilePictureUrl) as pic"
          [src]="pic"
          alt="Profile picture"
          class="user-avatar"
        />
        <span class="username">{{ user.username }}</span>
      </a>
      <button class="btn-logout" (click)="logout()">Log Out</button>
    </div>
  </div>
</header>

<router-outlet></router-outlet>
