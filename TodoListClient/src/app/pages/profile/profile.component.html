<div class="container" *ngIf="profile">
  <div class="page-header">
    <h1>My Profile</h1>
    <a routerLink="/" class="btn btn-secondary btn-sm">← Back to Tasks</a>
  </div>

  <section class="picture-section">
    <h2>Profile Picture</h2>
    <div class="picture-row">
      <img
        class="avatar"
        [src]="previewUrl || pictureUrl(profile.profilePictureUrl) || 'https://api.dicebear.com/7.x/initials/svg?seed=' + profile.username"
        alt="Profile picture"
      />
      <div class="picture-actions">
        <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" (change)="onFileSelected($event)" />
        <button class="btn btn-primary btn-sm" [disabled]="!selectedFile || isUploadingPicture" (click)="uploadPicture()">
          {{ isUploadingPicture ? 'Uploading...' : 'Upload' }}
        </button>
        <p class="error" *ngIf="pictureError">{{ pictureError }}</p>
      </div>
    </div>
  </section>

  <section class="username-section">
    <h2>Username</h2>
    <form (submit)="saveUsername(); $event.preventDefault()" class="inline-form">
      <input type="text" [(ngModel)]="usernameInput" name="username" required />
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSavingUsername">
        {{ isSavingUsername ? 'Saving...' : 'Save' }}
      </button>
    </form>
    <p class="success" *ngIf="usernameMessage">{{ usernameMessage }}</p>
    <p class="error" *ngIf="usernameError">{{ usernameError }}</p>
    <p class="hint">Email: {{ profile.email }}</p>
  </section>

  <section class="password-section">
    <h2>Change Password</h2>
    <form (submit)="changePassword(); $event.preventDefault()" class="stacked-form">
      <div class="form-group">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" type="password" [(ngModel)]="currentPassword" name="currentPassword" required />
      </div>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="isSavingPassword">
        {{ isSavingPassword ? 'Saving...' : 'Update Password' }}
      </button>
    </form>
    <p class="success" *ngIf="passwordMessage">{{ passwordMessage }}</p>
    <p class="error" *ngIf="passwordError">{{ passwordError }}</p>
  </section>

  <button class="btn btn-danger btn-sm logout-btn" (click)="logout()">Log Out</button>
</div>
