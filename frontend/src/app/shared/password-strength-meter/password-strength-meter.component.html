<div class="strength-meter" *ngIf="password">
  <div class="bars">
    <span
      *ngFor="let bar of [0, 1, 2, 3, 4]"
      class="bar"
      [style.background]="bar <= strength.score ? strength.color : 'var(--border)'"
    ></span>
  </div>
  <span class="label" [style.color]="strength.color">{{ strength.label }}</span>
</div>
